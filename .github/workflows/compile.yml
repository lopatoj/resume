name: Compile Resume
on: [push]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - uses: xu-cheng/texlive-action@v3
        with:
          run: |
            latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode resume.tex
            pdfcrop resume.pdf resume_cropped.pdf
      
      - name: Install ImageMagick and Pdfcrop
        run: |
          sudo apt update
          sudo apt upgrade
          sudo apt install imagemagick ghostscript

      - name: Crop and convert to png
        run: |
          convert -density 300 resume_cropped.pdf -quality 90 resume.png

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add resume.pdf resume.png
          git commit -m "Pushing compiled resume"
          git push
